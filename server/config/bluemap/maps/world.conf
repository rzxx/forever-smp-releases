# A surface-focused 3D map. Only the Overworld has a map config.
world: "world"
dimension: "minecraft:overworld"
name: "Overworld"

# A chunk must have accumulated a minute of nearby player time before it appears.
# Minecraft stores inhabited time in ticks; 1200 ticks is about 60 seconds.
min-inhabited-time: 1200

# Omit faces without skylight, including most underground/cave geometry.
remove-caves-below-y: 10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false

# Keep 3D perspective and close-up detail, but disable free flight into terrain.
enable-flat-view: true
enable-perspective-view: true
enable-free-flight-view: false
enable-hires: true
ignore-missing-light-data: false
